<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin - Arlene's Kitchen Table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bevan&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F1E8D2; --surface:#FFFBF0; --ink:#2B2118; --muted:#6B5B4B; --line:#D6C7A4;
  --accent:#A5332A; --accent-ink:#FFFFFF; --soft:#EBDCB8; --ok:#2F6B3A; --ok-ink:#FFFFFF;
  --display:'Bevan',Georgia,serif; --body:'Figtree',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1F1914; --surface:#2B231C; --ink:#F1E6D2; --muted:#B9A78F; --line:#443830;
  --accent:#E8907F; --accent-ink:#2A140F; --soft:#3B2F25; --ok:#7CCB8A; --ok-ink:#10230F; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding-inline:16px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:980px;margin-inline:auto;padding-block:20px 56px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--accent)}
h1{font:400 26px/1.15 var(--display);margin:0}
header small{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:8px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:var(--ok-ink);border-color:var(--ok)}
.btn.danger{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:wait}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:99px}
.tab[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab b{font-variant-numeric:tabular-nums}
.card{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:20px;margin-bottom:20px}
.card .pic img{display:block;width:100%;border-radius:4px;border:1px solid var(--line)}
.card .pic .none{background:var(--soft);border-radius:4px;padding:18px;color:var(--muted);font-size:14.5px}
.fields{display:flex;flex-direction:column;gap:12px;min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{font-weight:600;font-size:14px;display:block;margin-bottom:3px}
input[type=text],input[type=number],input[type=password],textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:96px;resize:vertical;line-height:1.45}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px}
.cats label{font-weight:400;display:flex;gap:6px;align-items:center;margin:0;font-size:14.5px}
.meta{font-size:13.5px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{margin:0 0 14px;padding:10px 14px;border-radius:8px;background:var(--soft)}
.msg.err{border:1px solid var(--accent)}
.empty{color:var(--muted);padding:32px 0}
code{background:var(--soft);padding:1px 6px;border-radius:4px;font-size:.92em;word-break:break-all}
ol{padding-left:20px}
@media (max-width:700px){.card{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Arlene's Kitchen Table</h1><small>Admin: approve cards before anyone else sees them</small></div>
    <div class="row" id="who" hidden><button class="btn" id="out">Forget my token on this device</button></div>
  </header>
  <div id="note" class="msg" hidden role="status"></div>
  <main id="app"></main>
</div>

<script src="config.js"></script>
<script>
const TREE=[
 ['Meals',[['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner']]],
 ['Dessert',[['cakes','Cakes'],['cookies','Cookies & Bars'],['pies','Pies & Pastries'],['puddings','Puddings & Custards']]],
 ['Breads',[['breads','Breads']]],
 ['Holiday',[['thanksgiving','Thanksgiving'],['christmas','Christmas']]],
 ['Ethnic',[['german','German'],['italian','Italian'],['mexican','Mexican'],['polish','Polish']]]
];
const cfg=window.AKT_CONFIG||{};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=$('#app');
const KEY='akt_admin_token';
let token='',pending=[],approved=[],tab='pending',confirming=null,shas={};
const blobs={};

function note(t,err){const n=$('#note');n.textContent=t;n.className='msg'+(err?' err':'');n.hidden=!t}
try{token=localStorage.getItem(KEY)||''}catch(e){}

/* ---- GitHub helpers ---- */
const api=(path,o={})=>fetch('https://api.github.com'+path,{...o,headers:{
  Authorization:'Bearer '+token,Accept:o.raw?'application/vnd.github.raw+json':'application/vnd.github+json',
  'X-GitHub-Api-Version':'2022-11-28',...(o.headers||{})}});
const inbox=p=>`/repos/${cfg.owner}/${cfg.inboxRepo}/contents/${p}`;
const pub=p=>`/repos/${cfg.owner}/${cfg.publicRepo}/contents/${p}`;
const enc=s=>{const b=new TextEncoder().encode(s);return bytes64(b)};
function bytes64(b){let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
const dec=b64=>new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const fail=async(r,what)=>{let m='';try{m=(await r.json()).message}catch(e){}throw new Error(`${what} (${r.status}${m?': '+m:''})`)};

/* ---- screens ---- */
function renderSetup(msg){
  $('#who').hidden=true;
  app.innerHTML=`<div class="box" style="max-width:640px"><h2 style="margin-top:0;font-size:20px">Sign in with a GitHub token</h2>
  <p class="meta">The token is saved only in this browser. It lets this page read the waiting list and publish approved cards.</p>
  <ol><li>On GitHub, open Settings, Developer settings, Personal access tokens, <b>Fine-grained tokens</b>, then <b>Generate new token</b>.</li>
  <li><b>Repository access:</b> only select repositories. Choose <code>${esc(cfg.publicRepo)}</code> and <code>${esc(cfg.inboxRepo)}</code>.</li>
  <li><b>Permissions:</b> Repository permissions, <b>Contents: Read and write</b>. Nothing else.</li>
  <li>Generate, copy the token, and paste it below.</li></ol>
  <form id="tk"><label for="t">Token</label><input type="password" id="t" autocomplete="off" required>
  <div class="row" style="margin-top:12px"><button class="btn primary" type="submit">Sign in</button></div></form>
  ${msg?`<p class="msg err" style="margin-top:14px">${esc(msg)}</p>`:''}</div>`;
  $('#tk').onsubmit=async e=>{e.preventDefault();token=$('#t').value.trim();
    try{
      for(const p of [pub('data'),inbox('')]){ // both repos must be reachable
        const r=await api(p.replace(/\/$/,''));
        if(r.status===401)throw new Error('GitHub did not accept that token.');
        if(r.status===404&&p.includes(cfg.inboxRepo)){const rr=await api(`/repos/${cfg.owner}/${cfg.inboxRepo}`);if(!rr.ok)throw new Error('The token cannot see the inbox repo. Check the repository access.')}
        else if(r.status===404&&p.includes('/data')){const rr=await api(`/repos/${cfg.owner}/${cfg.publicRepo}`);if(!rr.ok)throw new Error('The token cannot see the public repo. Check the repository access.')}
        else if(r.status===403)throw new Error('The token does not have Contents permission.');
      }
      try{localStorage.setItem(KEY,token)}catch(e2){}
      boot();
    }catch(err){token='';renderSetup(err.message)}
  };
}

/* ---- loading ---- */
async function loadPending(){
  const r=await api(inbox('submissions'));
  if(r.status===404){pending=[];shas={};return}
  if(!r.ok)await fail(r,'Could not read the waiting list');
  const files=await r.json();shas={};files.forEach(f=>shas[f.name]=f.sha);
  const ids=files.filter(f=>f.name.endsWith('.json')).map(f=>f.name.slice(0,-5));
  const out=[];
  for(const id of ids){
    const rr=await api(inbox(`submissions/${id}.json`),{raw:true});
    if(rr.ok)out.push(await rr.json());
  }
  pending=out.sort((a,b)=>String(b.created).localeCompare(String(a.created)));
}
async function getRecipes(){
  const m=await api(pub('data/recipes.json'));
  if(m.status===404)return {list:[],sha:null};
  if(!m.ok)await fail(m,'Could not read the published recipes');
  const meta=await m.json();
  const raw=await api(pub('data/recipes.json'),{raw:true});
  return {list:JSON.parse(await raw.text()||'[]'),sha:meta.sha};
}
async function putRecipes(list,sha,message){
  const body={message,content:enc(JSON.stringify(list,null,2)+'\n')};if(sha)body.sha=sha;
  const r=await api(pub('data/recipes.json'),{method:'PUT',body:JSON.stringify(body)});
  if(r.status===409||r.status===422)throw new Error('Someone else changed the site at the same moment. Refresh and try again.');
  if(!r.ok)await fail(r,'Could not publish');
}
async function loadAll(){
  note('Loading...');
  try{await loadPending();approved=(await getRecipes()).list;note('')}
  catch(e){note(e.message,true);if(/401/.test(e.message)){token='';try{localStorage.removeItem(KEY)}catch(x){}renderSetup('The saved token no longer works. Paste a new one.')}}
}

/* ---- list ---- */
function cardHTML(r,state){
  const pic=r.image?`<img data-img="${esc(r.image)}" data-state="${state}" alt="Photo of the card for ${esc(r.title)}">`:`<div class="none">Typed in with no photo.</div>`;
  const cats=TREE.map(([g,kids])=>kids.map(([id,l])=>`<label><input type="checkbox" name="cat" value="${id}" ${(r.cats||[]).includes(id)?'checked':''}> ${esc(g===l?l:g+': '+l)}</label>`).join('')).join('');
  const when=r.created||r.approved?new Date(r.created||r.approved).toLocaleString():'';
  let actions;
  if(state==='pending')actions=`<button class="btn ok" data-act="approve">Approve and publish</button>`+(confirming===r.id?`<button class="btn danger" data-act="reject">Yes, reject and delete</button><button class="btn" data-act="cancel">Keep it</button>`:`<button class="btn danger" data-act="ask">Reject</button>`);
  else actions=`<button class="btn" data-act="save">Save edits</button>`+(confirming===r.id?`<button class="btn danger" data-act="remove">Yes, remove from site</button><button class="btn" data-act="cancel">Keep it</button>`:`<button class="btn danger" data-act="ask">Remove from site</button>`);
  return `<article class="box card" data-card="${esc(r.id)}"><div class="pic">${pic}</div><div class="fields">
    <div><label>Name of the recipe</label><input type="text" name="title" value="${esc(r.title)}"></div>
    <div class="two"><div><label>Whose</label><input type="text" name="by" value="${esc(r.by)}"></div>
      <div><label>Where</label><input type="text" name="where" value="${esc(r.where)}"></div>
      <div><label>Year</label><input type="number" name="year" value="${esc(r.year)}"></div></div>
    <div><label>Ingredients, one per line</label><textarea name="ingredients">${esc((r.ingredients||[]).join('\n'))}</textarea></div>
    <div><label>Method</label><textarea name="method">${esc(r.method)}</textarea></div>
    <div><label>Categories</label><div class="cats">${cats}</div></div>
    <p class="meta">${state==='pending'?'Submitted':'Published'} ${esc(when)}${r.contact?' &middot; contact: '+esc(r.contact):''}</p>
    <div class="row">${actions}</div></div></article>`;
}
function render(){
  $('#who').hidden=false;
  const tabs=[['pending','Waiting for approval',pending.length],['approved','Published',approved.length]]
    .map(([k,l,n])=>`<button class="tab" data-tab="${k}" aria-pressed="${tab===k}">${l} <b>${n}</b></button>`).join('');
  const list=tab==='pending'?pending:approved;
  app.innerHTML=`<div class="tabs">${tabs}<button class="tab" data-act="refresh">Refresh</button></div>`+
    (list.length?list.map(r=>cardHTML(r,tab)).join(''):`<p class="empty">${tab==='pending'?'Nothing waiting. New cards will show up here.':'No cards are published yet.'}</p>`);
  hydrate();
}
async function hydrate(){
  for(const img of document.querySelectorAll('img[data-img]')){
    const name=img.dataset.img,state=img.dataset.state;
    try{
      if(!blobs[state+name]){
        const r=await api(state==='pending'?inbox('submissions/'+name):pub(name),{raw:true});
        if(!r.ok)continue;blobs[state+name]=URL.createObjectURL(await r.blob());
      }
      img.src=blobs[state+name];
    }catch(e){}
  }
}

/* ---- actions ---- */
function collect(el){
  const v=n=>el.querySelector(`[name=${n}]`).value.trim();
  return {title:v('title'),by:v('by'),where:v('where'),year:+v('year')||null,
    ingredients:v('ingredients').split('\n').map(s=>s.trim()).filter(Boolean),method:v('method')||null,
    cats:[...el.querySelectorAll('[name=cat]:checked')].map(x=>x.value)};
}
const lock=(el,on)=>el.querySelectorAll('button').forEach(b=>b.disabled=on);
async function delFile(repoPath,message){
  const m=await api(repoPath);if(m.status===404)return;
  const sha=(await m.json()).sha;
  const r=await api(repoPath,{method:'DELETE',body:JSON.stringify({message,sha})});
  if(!r.ok)await fail(r,'Could not delete a file');
}
async function approve(id){
  const el=document.querySelector(`[data-card="${id}"]`),p=pending.find(x=>x.id===id),f=collect(el);
  if(!f.title)return note('Give the recipe a name first.',true);
  if(!f.cats.length)return note('Pick at least one category before approving.',true);
  lock(el,true);note('Publishing...');
  try{
    let image=null;
    if(p.image){
      const r=await api(inbox('submissions/'+p.image),{raw:true});
      if(!r.ok)await fail(r,'Could not read the photo');
      const b64=bytes64(new Uint8Array(await r.arrayBuffer()));
      const path=`images/${id}.jpg`;
      const put=await api(pub(path),{method:'PUT',body:JSON.stringify({message:`Add photo: ${f.title}`,content:b64})});
      if(!put.ok&&put.status!==422)await fail(put,'Could not publish the photo');
      image=path;
    }
    const {list,sha}=await getRecipes();
    list.unshift({id,...f,manual:!image,image,approved:new Date().toISOString()});
    await putRecipes(list,sha,`Approve: ${f.title}`);
    await delFile(inbox(`submissions/${id}.json`),`Approved: ${f.title}`);
    if(p.image)await delFile(inbox('submissions/'+p.image),`Approved: ${f.title}`);
    await loadAll();render();note('Published. It will show on the site in a minute or two.');
  }catch(e){note(e.message,true);lock(el,false)}
}
async function saveEdits(id){
  const el=document.querySelector(`[data-card="${id}"]`),f=collect(el);
  if(!f.title)return note('Give the recipe a name first.',true);
  if(!f.cats.length)return note('Pick at least one category.',true);
  lock(el,true);
  try{
    const {list,sha}=await getRecipes();const i=list.findIndex(x=>x.id===id);
    if(i<0)throw new Error('That card is no longer published.');
    list[i]={...list[i],...f};await putRecipes(list,sha,`Edit: ${f.title}`);
    await loadAll();render();note('Saved. The site updates in a minute or two.');
  }catch(e){note(e.message,true);lock(el,false)}
}
async function removeFromSite(id){
  const el=document.querySelector(`[data-card="${id}"]`);lock(el,true);
  try{
    const {list,sha}=await getRecipes();const r=list.find(x=>x.id===id);
    await putRecipes(list.filter(x=>x.id!==id),sha,`Remove: ${r?r.title:id}`);
    if(r&&r.image)await delFile(pub(r.image),`Remove photo: ${r.title}`);
    confirming=null;await loadAll();render();note('Removed from the site.');
  }catch(e){note(e.message,true);lock(el,false)}
}
async function reject(id){
  const el=document.querySelector(`[data-card="${id}"]`),p=pending.find(x=>x.id===id);lock(el,true);
  try{
    await delFile(inbox(`submissions/${id}.json`),`Rejected: ${p.title}`);
    if(p.image)await delFile(inbox('submissions/'+p.image),`Rejected: ${p.title}`);
    confirming=null;await loadAll();render();note('Rejected and deleted.');
  }catch(e){note(e.message,true);lock(el,false)}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='out'){token='';try{localStorage.removeItem(KEY)}catch(x){}renderSetup('');return}
  if(b.dataset.tab){tab=b.dataset.tab;confirming=null;note('');render();return}
  const a=b.dataset.act;if(!a)return;
  if(a==='refresh'){loadAll().then(render);return}
  const id=b.closest('[data-card]')?.dataset.card;if(!id)return;
  if(a==='approve')approve(id);
  else if(a==='save')saveEdits(id);
  else if(a==='ask'){confirming=id;render()}
  else if(a==='cancel'){confirming=null;render()}
  else if(a==='reject')reject(id);
  else if(a==='remove')removeFromSite(id);
});

async function boot(){
  if(!cfg.owner||!cfg.publicRepo||!cfg.inboxRepo){app.innerHTML='<div class="box">config.js is missing the repository names.</div>';return}
  if(!token)return renderSetup('');
  await loadAll();if(token)render();
}
boot();
</script>
</body>
</html>
